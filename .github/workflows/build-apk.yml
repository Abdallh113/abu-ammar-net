name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Add RouterOS API plugin
        run: |
          mkdir -p android/app/src/main/java/com/abuammar/net
          cp native/*.java android/app/src/main/java/com/abuammar/net/
      - name: Allow http to the router
        run: sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: abu-ammar-net-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
