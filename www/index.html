<!DOCTYPE html>
<html lang="ar" dir="rtl" data-th="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أبو عمار نت</title>
<style>
:root{--ink:#eaf2ff;--mute:#a9bbd3;--glass:rgba(255,255,255,.10);--line:rgba(255,255,255,.18);--inp:rgba(255,255,255,.08);--bg1:#0b1f3a;--bg2:#0c5560;--nav:rgba(8,22,40,.72);--acc:#7cc4ff;--ok:#4cd9a0;--bad:#ff8a80}
:root[data-th=light]{--ink:#12263a;--mute:#5b6e82;--glass:rgba(255,255,255,.62);--line:rgba(20,40,70,.14);--inp:rgba(255,255,255,.75);--bg1:#e6f1ff;--bg2:#d6f1ec;--nav:rgba(255,255,255,.8);--acc:#1f5fd1;--ok:#12936a;--bad:#d6382c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);font-family:system-ui,Tahoma,Arial,sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.ic{vertical-align:middle;flex:none}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header .lg{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#ff6a5a,#d6382c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
header b{font-size:18px}header small{display:block;font-size:12px;color:var(--mute)}
#v{padding:12px;max-width:720px;margin:0 auto}
.card{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--inp);border-radius:12px;padding:10px;text-align:center}.st b{display:block;font-size:19px;color:var(--acc);direction:ltr}.st span{font-size:12px;color:var(--mute)}
.meter{background:var(--inp);border-radius:12px;padding:10px}.meter .t{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)}.meter b{font-size:16px;color:var(--ink)}
.bar{height:6px;border-radius:6px;background:var(--line);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#3b9cff,#2fd68b)}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--inp);color:var(--ink)}
select option{color:#000}input[type=range]{padding:0;accent-color:#3b9cff}input[type=color]{padding:2px;height:40px}
.ltr{direction:ltr;text-align:left}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--glass);font:inherit;font-weight:600;color:var(--ink);cursor:pointer;text-decoration:none}
.btn.w{width:100%;margin-top:12px}.btn.s{padding:5px 11px;font-size:12px}
.b-blue,.b-green,.b-orange,.b-purple,.b-red{color:#fff;border:0}
.b-red{background:linear-gradient(135deg,#ff6a5a,#d6382c)}.b-blue{background:linear-gradient(135deg,#3b9cff,#1f5fd1)}.b-green{background:linear-gradient(135deg,#2fd68b,#12936a)}.b-orange{background:linear-gradient(135deg,#ffb347,#f0761c)}.b-purple{background:linear-gradient(135deg,#a37bff,#6a3fd1)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ok{color:var(--ok)}.bad{color:var(--bad)}small,.m{color:var(--mute);font-size:12px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.it:last-child{border:0}.it .c{direction:ltr;font-family:monospace;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:14px;border:1px solid var(--line);background:var(--inp);color:var(--mute);font:inherit;font-size:12px}
.seg button.on{background:linear-gradient(135deg,#3b9cff,#1f5fd1);color:#fff;border-color:transparent}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:18px;background:var(--glass);border:1px solid var(--line);font-weight:700;font-size:14px;text-align:center;cursor:pointer;position:relative}
.tile .ti{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.tile .soon{position:absolute;top:8px;inset-inline-start:8px;font-size:10px;background:var(--inp);border-radius:8px;padding:1px 7px;color:var(--mute);font-weight:400}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));inset-inline:12px;max-width:520px;margin:0 auto;display:flex;background:var(--nav);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;padding:6px 4px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:7px 1px;border-radius:14px;font:inherit;font-size:10.5px;color:var(--mute)}
nav button.on{color:#fff;background:linear-gradient(135deg,#3b9cff,#1f5fd1)}
.toast{position:fixed;inset-inline:16px;bottom:96px;background:rgba(0,0,0,.85);color:#fff;padding:10px 14px;border-radius:12px;text-align:center;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.on{opacity:1}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:20}
#ov .bx{width:min(320px,86vw);background:var(--bg1);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:center;color:#eaf2ff}
#ov .pb{height:10px;border-radius:10px;background:rgba(255,255,255,.15);margin:14px 0 8px;overflow:hidden}#ov .pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b9cff,#2fd68b);transition:width .2s}
canvas{width:100%;border-radius:10px;background:#fff;display:block}
.ab{text-align:center}.av{width:124px;height:124px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.55);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.ab h2{margin:10px 0 2px;font-size:20px}.ab p{margin:4px 0;color:var(--mute);font-size:14px}
.soc a{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-top:8px;border-radius:14px;background:var(--inp);border:1px solid var(--line);color:var(--ink);text-decoration:none}
.soc i{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}.soc svg{width:22px;height:22px;fill:#fff}.soc small{display:block;direction:ltr;text-align:right}
.hello h2{margin:0;font-size:22px}.hello p{margin:2px 0 12px;color:var(--mute);font-size:13px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);padding:6px}.sum div{text-align:center;padding:8px 2px}.sum div+div{border-inline-start:1px solid var(--line)}.sum b{display:block;font-size:22px}.sum span{font-size:12px;color:var(--mute)}
.plan{display:flex;gap:12px;align-items:center}.plan .ti{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;flex:none}.plan p{margin:2px 0;font-size:13px;color:var(--mute)}.plan b{font-size:16px}
</style>
</head>

const b64d=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
async function checkLic(code){
  try{const [p,s]=String(code).trim().split(".");const data=b64d(p);
    const key=await crypto.subtle.importKey("jwk",PUB,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
    if(!await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,b64d(s),data))return null;
    const o=JSON.parse(new TextDecoder().decode(data));
    if(o.d!==S.did)return null;
    if(o.e&&new Date(o.e)<new Date())return null;
    return RANK[o.t]!==undefined?o:null}catch(e){return null}
}
const LIC_URL="https://raw.githubusercontent.com/Abdallh113/abu-ammar-net/main/licenses.json";
async function checkOnline(){
  try{const r=await fetch(LIC_URL+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)return undefined;
    const o=((await r.json()).devices||{})[S.did];if(!o)return null;
    if(o.e&&new Date(o.e)<new Date())return null;return RANK[o.t]!==undefined?o:null}catch(e){return undefined}
}
const rnd=(n,k)=>{const s=k==="num"?"0123456789":"abcdefghjkmnpqrstuvwxyz23456789",a=new Uint32Array(n);crypto.getRandomValues(a);return[...a].map(x=>s[x%s.length]).join("")};
async function applyLic(){
  if(!S.did){S.did="AB-"+rnd(6,"alnum").toUpperCase();save()}
  let o=S.lic?await checkLic(S.lic):null;
  if(!o){const on=await checkOnline();
    if(on){S.onl=Object.assign({at:Date.now()},on);save();o=on}
    else if(on===null){delete S.onl;save()}
    else if(S.onl&&Date.now()-S.onl.at<30*864e5&&(!S.onl.e||new Date(S.onl.e)>new Date()))o=S.onl}
  L=o?{t:o.t,c:o.c||""}:{t:"free",c:""};
  $("#tier").textContent=TN[L.t]+(L.c?" · "+L.c:"");
}

const RO=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.RouterOs;
function hint(m){
  m=String(m);
  if(m==="TIMEOUT")return"لا يوجد رد من الراوتر. تأكد أن الموبايل على نفس شبكة الراوتر وأن العنوان صحيح";
  if(m==="REFUSED")return"الراوتر رفض الاتصال. فعّل خدمة api من IP ▸ Services (المنفذ 8728)";
  if(/cannot log in|invalid user/i.test(m))return"اليوزر أو كلمة المرور غير صحيحة";
  return m.replace(/^TRAP: /,"");
}
async function api(m,p,b){
  const r=RO();
  if(!r){ // browser preview only
    const x=await fetch("http://"+S.ip+"/rest"+p,{method:m,headers:{Authorization:"Basic "+btoa(S.user+":"+S.pass),"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});
    return x.json();
  }
  let path=p,attrs=Object.assign({},b||{}),q=p.indexOf("?");
  if(q>=0){path=p.slice(0,q);p.slice(q+1).split("&").forEach(x=>{const k=x.indexOf("=");attrs[x.slice(0,k)]=x.slice(k+1)})}
  let cmd=path;
  if(m==="GET")cmd+="/print";else if(m==="PUT")cmd+="/add";
  else if(m==="DELETE"){const k=path.lastIndexOf("/");attrs[".id"]=path.slice(k+1);cmd=path.slice(0,k)+"/remove"}
  try{const o=await r.exec({host:S.ip,port:+S.port||8728,user:S.user,pass:S.pass,cmd,attrs:JSON.stringify(attrs)});return JSON.parse(o.data)}
  catch(e){throw new Error(hint(e.message||e))}
}
async function addBatch(cmds,onp){
  const r=RO();let ok=0,fail=0,err="";
  for(let i=0;i<cmds.length;i+=10){
    const ch=cmds.slice(i,i+10);
    if(r){try{const o=await r.batch({host:S.ip,port:+S.port||8728,user:S.user,pass:S.pass,cmds:JSON.stringify(ch)});ok+=o.ok;fail+=o.fail;err=err||o.error}catch(e){throw new Error(hint(e.message||e))}}
    else for(const c of ch){try{await api("PUT",c.cmd.replace("/add",""),c.attrs);ok++}catch(e){fail++}}
    onp&&onp(ok+fail,cmds.length);
  }
  return{ok,fail,err};
}
async function autoPort(){
  if(S.ifc)return S.ifc;
  try{const r=await api("GET","/ip/route?.proplist=dst-address,immediate-gw,gateway");
    const d=(Array.isArray(r)?r:[]).find(x=>x["dst-address"]==="0.0.0.0/0"&&/%/.test(x["immediate-gw"]||x.gateway||""));
    if(d)return(d["immediate-gw"]||d.gateway).split("%")[1]}catch(e){}
  try{const r=await api("GET","/interface?.proplist=name,type,running");const i=(Array.isArray(r)?r:[]).find(x=>x.type==="ether"&&x.running==="true");if(i)return i.name}catch(e){}
  return"ether1";
}
const bps=n=>{n=+n||0;return n>=1e6?(n/1e6).toFixed(1)+" Mbit/s":(n/1e3).toFixed(0)+" Kbit/s"};

const DUR=[["1h","ساعة"],["3h","3 ساعات"],["12h","12 ساعة"],["1d","يوم"],["3d","3 أيام"],["7d","أسبوع"],["30d","شهر"]];

function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function drawCard(g,x,y,w,h,o,code,meta){
  g.save();g.translate(x,y);g.fillStyle="#fff";rr(g,0,0,w,h,h*.1);g.fill();
  g.strokeStyle=o.col;g.lineWidth=Math.max(1,h*.03);g.setLineDash([h*.09,h*.05]);rr(g,0,0,w,h,h*.1);g.stroke();g.setLineDash([]);
  const ax=o.al==="center"?w/2:o.al==="right"?w-h*.12:h*.12;
  g.textBaseline="middle";g.fillStyle=o.col;g.textAlign=o.al;g.direction="rtl";g.font=`700 ${h*o.ts/100}px Tahoma,Arial,sans-serif`;g.fillText(o.title,ax,h*.17);
  g.fillStyle="#111";g.direction="ltr";g.textAlign="center";g.font=`700 ${h*o.cs/100}px Consolas,"Courier New",monospace`;g.fillText(code,w/2,h*o.cy/100);
  if(o.foot&&meta){g.fillStyle="#555";g.direction="rtl";g.font=`${h*o.fs/100}px Tahoma,Arial,sans-serif`;g.fillText(meta,w/2,h*.89)}
  g.restore();
}
const A4={w:1654,h:2339,m:47};
const cell=()=>{const cw=(A4.w-2*A4.m)/S.cols,ch=(A4.h-2*A4.m)/S.rows;return{cw,ch}};
function ONLOGIN(d){return':local u $user;:if ([:len [/system scheduler find name=$u]]=0) do={/system scheduler add name=$u interval='+d+' start-date=[/system clock get date] start-time=[/system clock get time] on-event=("/ip hotspot user remove [find name=\\"".$u."\\"];/system scheduler remove [find name=\\"".$u."\\"]")}'}
async function ensureProf(pf,d){
  const name=pf+"-"+d,ex=await api("GET","/ip/hotspot/user/profile?.proplist=name,rate-limit,shared-users");
  if(ex.some(x=>x.name===name))return name;
  const base=ex.find(x=>x.name===pf)||{},b={name,"shared-users":base["shared-users"]||"1","on-login":ONLOGIN(d)};
  if(base["rate-limit"])b["rate-limit"]=base["rate-limit"];
  await api("PUT","/ip/hotspot/user/profile",b);return name;
}

function buildPdf(jpgs){
  const parts=[],off=[],enc=new TextEncoder();let len=0;
  const add=x=>{const b=typeof x==="string"?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(n,s)=>{off[n]=len;add(n+" 0 obj\n"+s+"\nendobj\n")};
  add("%PDF-1.4\n");obj(1,"<</Type/Catalog/Pages 2 0 R>>");
  obj(2,"<</Type/Pages/Count "+jpgs.length+"/Kids["+jpgs.map((_,i)=>(3+i*3)+" 0 R").join(" ")+"]>>");
  jpgs.forEach((j,i)=>{const p=3+i*3,c="q 595.28 0 0 841.89 0 0 cm /I Do Q";
    obj(p,"<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</I "+(p+2)+" 0 R>>>>/Contents "+(p+1)+" 0 R>>");
    obj(p+1,"<</Length "+c.length+">>\nstream\n"+c+"\nendstream");
    off[p+2]=len;add((p+2)+" 0 obj\n<</Type/XObject/Subtype/Image/Width "+A4.w+"/Height "+A4.h+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+j.length+">>\nstream\n");add(j);add("\nendstream\nendobj\n")});
  const tot=3+jpgs.length*3,xr=len;
  add("xref\n0 "+tot+"\n0000000000 65535 f \n"+off.slice(1,tot).map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+"trailer\n<</Size "+tot+"/Root 1 0 R>>\nstartxref\n"+xr+"\n%%EOF");
  const out=new Uint8Array(len);let p=0;parts.forEach(b=>{out.set(b,p);p+=b.length});return out;
}
async function sharePdf(b){
  const {cw,ch}=cell(),per=S.rows*S.cols,jpgs=[],g=4;
  for(let i=0;i<b.users.length;i+=per){
    const c=document.createElement("canvas");c.width=A4.w;c.height=A4.h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,A4.w,A4.h);
    b.users.slice(i,i+per).forEach((u,k)=>drawCard(x,A4.m+(k%S.cols)*cw+g,A4.m+Math.floor(k/S.cols)*ch+g,cw-2*g,ch-2*g,S.cd,u,b.meta));
    jpgs.push(b64d(c.toDataURL("image/jpeg",.92).split(",")[1].replace(/\+/g,"-").replace(/\//g,"_")));
  }
  const pdf=buildPdf(jpgs),name=(S.fname||"cards").replace(/[\\/:*?"<>|]/g,"_")+".pdf";
  let bin="";for(let i=0;i<pdf.length;i+=8192)bin+=String.fromCharCode.apply(null,pdf.subarray(i,i+8192));
  const P=window.Capacitor&&Capacitor.Plugins;
  if(P&&P.Filesystem&&P.Share){const f=await P.Filesystem.writeFile({path:name,data:btoa(bin),directory:"CACHE"});await P.Share.share({title:name,url:f.uri,dialogTitle:"حفظ أو فتح "+name})}
  else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([pdf],{type:"application/pdf"}));a.download=name;a.click()}
}
