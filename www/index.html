<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أبو عمار نت</title>
<style>
:root{--ink:#eaf2ff;--mute:#a9bbd3;--line:rgba(255,255,255,.18);--glass:rgba(255,255,255,.10);--brand:#ff5a4d;--acc:#7cc4ff;--ok:#4cd9a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(160deg,#0b1f3a 0%,#0f3b57 55%,#0c5560 100%) fixed;color:var(--ink);font-family:system-ui,Tahoma,Arial,sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:calc(66px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(255,255,255,.07);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header .lg{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#ff6a5a,#d6382c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;box-shadow:0 4px 12px rgba(214,56,44,.5)}
header b{font-size:18px}header small{display:block;font-size:12px;color:var(--mute)}
#v{padding:12px;max-width:720px;margin:0 auto}
.card{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.card h3{margin:0 0 10px;font-size:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:rgba(255,255,255,.08);border-radius:12px;padding:10px;text-align:center}.st b{display:block;font-size:20px;color:var(--acc);direction:ltr}.st span{font-size:12px;color:var(--mute)}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;font:inherit;background:rgba(255,255,255,.08);color:#fff}
select option{color:#000}input::placeholder{color:rgba(255,255,255,.45)}
.ltr{direction:ltr;text-align:left}
.btn{display:inline-block;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.12);font:inherit;font-weight:600;color:#fff;cursor:pointer}
.btn.p,.b-red{background:linear-gradient(135deg,#ff6a5a,#d6382c);border:0}
.b-blue{background:linear-gradient(135deg,#3b9cff,#1f5fd1);border:0}.b-green{background:linear-gradient(135deg,#2fd68b,#12936a);border:0}
.b-orange{background:linear-gradient(135deg,#ffb347,#f0761c);border:0}.b-purple{background:linear-gradient(135deg,#a37bff,#6a3fd1);border:0}
.btn.w{width:100%;margin-top:12px}.btn.s{padding:5px 11px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ok{color:var(--ok)}.bad{color:#ff8a80}small,.m{color:var(--mute);font-size:12px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.it:last-child{border:0}
.it .c{direction:ltr;font-family:monospace;font-weight:700}
.tile{position:relative;text-align:center;padding:18px 8px;border-radius:18px;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.25);box-shadow:0 8px 20px rgba(0,0,0,.25);cursor:pointer}
.tile i{display:block;font-style:normal;font-size:26px;margin-bottom:4px}
.t1{background:linear-gradient(135deg,rgba(59,156,255,.85),rgba(31,95,209,.85))}.t2{background:linear-gradient(135deg,rgba(47,214,139,.85),rgba(18,147,106,.85))}
.t3{background:linear-gradient(135deg,rgba(255,179,71,.9),rgba(240,118,28,.9))}.t4{background:linear-gradient(135deg,rgba(255,214,90,.9),rgba(196,140,20,.9))}
.t5{background:linear-gradient(135deg,rgba(163,123,255,.85),rgba(106,63,209,.85))}.t6{background:linear-gradient(135deg,rgba(255,106,90,.85),rgba(214,56,44,.85))}
.tag{position:absolute;top:6px;inset-inline-start:6px;font-size:10px;background:rgba(0,0,0,.35);border-radius:8px;padding:1px 7px}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:rgba(8,22,40,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:11px 1px;font:inherit;font-size:11px;color:var(--mute)}
nav button.on{color:#fff;font-weight:700;text-shadow:0 0 12px rgba(124,196,255,.8)}
.toast{position:fixed;inset-inline:16px;bottom:88px;background:rgba(0,0,0,.8);color:#fff;padding:10px 14px;border-radius:12px;text-align:center;opacity:0;pointer-events:none;transition:.2s}.toast.on{opacity:1}
.ab{text-align:center}.av{width:124px;height:124px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.55);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.ab h2{margin:10px 0 2px;font-size:20px}.ab p{margin:4px 0;color:var(--mute);font-size:14px}
.soc a{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-top:8px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:#fff;text-decoration:none}
.soc i{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;border:1px solid rgba(255,255,255,.25)}.soc svg{width:22px;height:22px;fill:#fff}
.soc span{display:block}.soc small{display:block;direction:ltr;text-align:right}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.1);border-radius:12px;padding:8px 10px;font:inherit;color:#fff;font-size:18px;cursor:pointer}
.chip.s{font-size:13px;padding:6px 10px}.chip.on{outline:2px solid var(--acc)}.chip.tc{width:40px;height:34px;padding:0;border:0}
.ics{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ck{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;color:#fff}.ck input{width:auto}
.tile.add{background:rgba(255,255,255,.08);border-style:dashed}
</style>
</head>
<body>
<div id="v"></div>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),v=$("#v");
const E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PUB={"kty":"EC","x":"peU5KL2OSoZiiZuU18--IiUfJoXULGG8VjwQOU5-V-o","y":"zRx0kI7wVds_zlCsfh4Sa6t2UI2hoaSjOL4UjkNFlxg","crv":"P-256"};
const RANK={free:0,pro:1,vip:2};
let S=Object.assign({ip:"192.168.88.1",user:"admin",pass:"",https:false,ifc:"ether1",lic:"",rows:10,cols:3,color:"#c0362c",ssid:"Abu Ammar Net",showPrice:true},JSON.parse(localStorage.getItem("aan")||"{}"));
let L={t:"free",c:""},tm=null,lastBatch=null;
const save=()=>localStorage.setItem("aan",JSON.stringify(S));
if(!Array.isArray(S.nets)){S.nets=[];if(S.pass)S.nets.push({id:"n0",name:"شبكتي",i:"📶",c:1,ip:S.ip,user:S.user,pass:S.pass,https:!!S.https,ifc:S.ifc||"ether1"})}
S.cd=Object.assign({ssid:S.ssid||"Abu Ammar Net",biz:"أبو عمار للرقمنة والحلول البرمجية",phone:"واتساب: +249961270800",note:"",cur:"ج",cols:S.cols||2,color:"#000000",fs:1,showPrice:true,showDur:true,showQuota:true,showPass:true},S.cd||{});
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2600)}
function need(t){if(RANK[L.t]>=RANK[t])return true;toast("هذه الميزة "+t.toUpperCase()+": فعّل كود الترخيص من الإعدادات");return false}

// ---- license (offline signature check) ----
const b64d=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
async function checkLic(code){
  try{
    const [p,s]=String(code).trim().split(".");const data=b64d(p);
    const key=await crypto.subtle.importKey("jwk",PUB,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
    if(!await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,b64d(s),data))return null;
    const o=JSON.parse(new TextDecoder().decode(data));
    if(o.e&&new Date(o.e)<new Date())return null;
    return RANK[o.t]!==undefined?o:null;
  }catch(e){return null}
}
const LIC_URL="https://raw.githubusercontent.com/Abdallh113/abu-ammar-net/main/licenses.json";
async function checkOnline(){
  try{const r=await fetch(LIC_URL+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)return undefined;
    const o=((await r.json()).devices||{})[S.did];if(!o)return null;
    if(o.e&&new Date(o.e)<new Date())return null;return RANK[o.t]!==undefined?o:null}catch(e){return undefined}
}
async function applyLic(){
  if(!S.did){S.did="AB-"+rnd(6,"alnum").toUpperCase();save()}
  let o=S.lic?await checkLic(S.lic):null;
  if(!o){const on=await checkOnline();
    if(on){S.onl=Object.assign({at:Date.now()},on);save();o=on}
    else if(on===null){delete S.onl;save()}
    else if(S.onl&&Date.now()-S.onl.at<30*864e5&&(!S.onl.e||new Date(S.onl.e)>new Date()))o=S.onl}
  L=o?{t:o.t,c:o.c||""}:{t:"free",c:""};
}

// ---- RouterOS REST ----
const normIp=v=>String(v||"").trim().replace(/^https?:\/\//i,"").replace(/\/.*$/,"").replace(/\s+/g,"");
const b64u=t=>btoa(unescape(encodeURIComponent(t)));
const PUBDNS=["1.1.1.1","1.0.0.1","8.8.8.8","8.8.4.4","9.9.9.9"];
const CANDS=["192.168.88.1","192.168.1.1","192.168.0.1","10.0.0.1","10.10.10.1","172.16.0.1","192.168.100.1"];
function mkErr(msg,code){const e=new Error(msg);e.code=code;return e}
async function probe(host,https,ms,u,p){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch((https?"https":"http")+"://"+host+"/rest/system/resource",{headers:{Authorization:"Basic "+b64u(u+":"+p)},signal:c.signal});const x=await r.text();let j=null;try{j=JSON.parse(x)}catch(e){}if(j===null||typeof j!=="object")return 0;return r.status===200||r.status===401?r.status:0}catch(e){return 0}finally{clearTimeout(t)}}
async function scan(https,u,p){const rs=await Promise.all(CANDS.map(async h=>({h,st:await probe(h,https,3500,u,p)})));return rs.find(x=>x.st===200||x.st===401)}
async function findRouter(u,p){const f=await scan(false,u,p);if(f)return{host:f.h,https:false};const g=await scan(true,u,p);return g?{host:g.h,https:true}:null}
async function getGateway(){try{const C=window.Capacitor;const P=C&&(C.registerPlugin?C.registerPlugin("Gateway"):(C.Plugins&&C.Plugins.Gateway));if(!P)return"";const r=await P.get();return normIp(r&&r.gateway)}catch(e){return""}}
async function api(m,p,b){
  S.ip=normIp(S.ip);
  if(!S.ip)throw mkErr("لم تحدد شبكة. اختر شبكة من الرئيسية.","none");
  const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);
  try{
    const r=await fetch((S.https?"https":"http")+"://"+S.ip+"/rest"+p,{method:m,headers:{Authorization:"Basic "+b64u(S.user+":"+S.pass),"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined,signal:c.signal});
    const x=await r.text();let j,isJ=true;try{j=JSON.parse(x)}catch(e){j=x;isJ=false}
    if(!isJ&&x.trim()!=="")throw mkErr("الرد ليس من واجهة REST للراوتر. غالباً صفحة تسجيل دخول الهوتسبوت تعترض الاتصال. حل مضمون: في الراوتر نفّذ /ip service set www port=8080 ثم اكتب العنوان هكذا: "+S.ip.split(":")[0]+":8080","captive");
    if(r.status===401)throw mkErr("اسم المستخدم أو كلمة المرور غير صحيحة","auth");
    if(r.status===404)throw mkErr("هذا العنوان لا يرد كراوتر مايكروتك (404). تأكد من العنوان ومن إصدار RouterOS v7.1 أو أحدث.","notfound");
    if(!r.ok)throw mkErr(((j&&(j.detail||j.message))||"")+" (HTTP "+r.status+")","http");
    return j;
  }catch(e){
    if(e.code)throw e;
    if(e.name==="AbortError")throw mkErr("انتهت مهلة الاتصال: الراوتر لا يرد على "+S.ip+". تأكد من العنوان، وتفعيل خدمة www، وأن الموبايل على واي فاي الراوتر.","timeout");
    throw mkErr("تعذر الوصول إلى الراوتر "+S.ip+". تأكد من العنوان وأن الموبايل على نفس الشبكة.","net");
  }finally{clearTimeout(t)}
}
async function addRec(p,b){try{return await api("POST",p+"/add",b)}catch(e){if(e.code==="http"&&/405|404/.test(e.message))return await api("PUT",p,b);throw e}}
async function delRec(p,id){try{return await api("POST",p+"/remove",{".id":id})}catch(e){if(e.code==="http"&&/405|404/.test(e.message))return await api("DELETE",p+"/"+id);throw e}}
const bps=n=>{n=+n||0;return n>=1e6?(n/1e6).toFixed(1)+" Mbit/s":(n/1e3).toFixed(0)+" Kbit/s"};

// ---- navigation ----
const TABS=[["home","الرئيسية"],["users","المستخدمون"],["cards","الكروت"],["profiles","الباقات"],["set","الإعدادات"],["about","من نحن"]];
$("#nav").innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join("");
$("#nav").onclick=e=>{if(e.target.dataset.t)go(e.target.dataset.t)};
function go(t){clearInterval(tm);document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));if(["users","cards","profiles"].includes(t)&&!LIVE){needNet();return}({home,users,cards,profiles,set:settings,about})[t]()}

// ---- networks & home ----
let LIVE=false;
const ICONS=["📶","🛜","🏠","🏢","🏪","☕","🏨","🏫","🕌","🏥","🚗","⚡","🌐","📡","🛒","🍔"];
const GRAD=["linear-gradient(135deg,#3b9cff,#1f5fd1)","linear-gradient(135deg,#2fd68b,#12936a)","linear-gradient(135deg,#ffb347,#f0761c)","linear-gradient(135deg,#ffd65a,#c48c14)","linear-gradient(135deg,#a37bff,#6a3fd1)","linear-gradient(135deg,#ff6a5a,#d6382c)"];
const MAXN=15;
const getNet=id=>S.nets.find(n=>n.id===id);
function useNet(n){Object.assign(S,{cur:n.id,ip:n.ip,user:n.user,pass:n.pass,https:!!n.https,ifc:n.ifc||"ether1"});save()}
function needNet(){v.innerHTML=`<div class="card"><h3>اختر شبكة أولاً</h3><p class="m">لن يتصل التطبيق بأي راوتر تلقائياً. افتح الرئيسية واضغط على شبكتك للاتصال بها.</p><button class="btn b-blue w" onclick="go('home')">الشبكات</button></div>`}
function home(){
  clearInterval(tm);
  const ns=S.nets;
  v.innerHTML=`<div class="card"><h3>شبكاتي <small>${ns.length} / ${MAXN}</small></h3><div class="g2" id="nl">${ns.map(n=>`<div class="tile t${n.c}" data-n="${E(n.id)}"><i>${E(n.i)}</i>${E(n.name)}<span class="tag" data-e="${E(n.id)}">✏️ تعديل</span></div>`).join("")}${ns.length<MAXN?`<div class="tile add" id="addn"><i>➕</i>إضافة شبكة</div>`:""}</div>
  <p class="m" style="margin-top:10px">${ns.length?"اضغط على الشبكة للاتصال بها وإدارتها. لا يتم الاتصال بأي راوتر إلا عند الضغط.":"لا توجد شبكات بعد. أضف شبكتك الأولى وأدخل بيانات الراوتر."}</p></div>
  <div class="g2"><div class="tile t5" data-g="set"><i>⚙️</i>الإعدادات والتفعيل</div><div class="tile t6" data-g="about"><i>👤</i>من نحن</div></div>`;
  v.querySelectorAll("[data-g]").forEach(x=>x.onclick=()=>go(x.dataset.g));
  const a=$("#addn");if(a)a.onclick=()=>netForm();
  $("#nl").onclick=e=>{const ed=e.target.closest("[data-e]");if(ed){e.stopPropagation();netForm(ed.dataset.e);return}const t=e.target.closest("[data-n]");if(t)openNet(t.dataset.n)};
}
function openNet(id){const n=getNet(id);if(!n)return;useNet(n);LIVE=true;dash()}
async function dash(){
  const n=getNet(S.cur)||{i:"📶",name:""};
  v.innerHTML=`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${E(n.i)} ${E(n.name)}</b><span><button class="btn s" id="ed">✏️ تعديل</button> <button class="btn s" id="bk">الشبكات</button></span></div>
  <div class="card" id="st">جاري الاتصال بالراوتر…</div><div class="card"><h3>السرعة المباشرة (${E(S.ifc)})</h3><div class="g2"><div class="st"><b id="up">—</b><span>رفع</span></div><div class="st"><b id="dn">—</b><span>تحميل</span></div></div></div><div class="card"><div class="g2" id="ct"></div></div>
  <div class="g2"><div class="tile t1" data-g="users"><i>👥</i>مستخدمو الهوتسبوت</div><div class="tile t2" data-g="cards"><i>🎫</i>توليد الكروت</div><div class="tile t3" data-g="profiles"><i>📦</i>الباقات<span class="tag">PRO</span></div><div class="tile t4" id="tvip"><i>🛠</i>برمجة المايكروتك<span class="tag">VIP</span></div></div>`;
  v.querySelectorAll("[data-g]").forEach(x=>x.onclick=()=>go(x.dataset.g));$("#tvip").onclick=()=>need("vip")&&toast("قريباً");
  $("#bk").onclick=()=>go("home");$("#ed").onclick=()=>netForm(S.cur);
  try{
    const r=await api("GET","/system/resource");
    if(!r||!r["board-name"])throw mkErr("الرد ليس من راوتر مايكروتك. تأكد من العنوان والمنفذ.","bad");
    const used=Math.round(100-(r["free-memory"]/r["total-memory"])*100);
    $("#st").innerHTML=`<b class="ok">● متصل</b> <small>${E(r["board-name"])} · RouterOS ${E(r.version)}</small><div class="g2" style="margin-top:10px"><div class="st"><b>${E(r["cpu-load"])}%</b><span>المعالج</span></div><div class="st"><b>${used}%</b><span>الذاكرة</span></div></div><p class="m">مدة التشغيل: ${E(r.uptime)}</p>`;
    const [u,a,p]=await Promise.all([api("GET","/ip/hotspot/user?.proplist=.id"),api("GET","/ip/hotspot/active?.proplist=.id"),api("GET","/ip/hotspot/user/profile?.proplist=.id")]);
    $("#ct").innerHTML=[[u.length,"هوتسبوت"],[a.length,"نشط الآن"],[p.length,"بروفايلات"]].map(x=>`<div class="st"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");
    const poll=async()=>{try{const t=(await api("POST","/interface/monitor-traffic",{interface:S.ifc,once:""}))[0];$("#up").textContent=bps(t["tx-bits-per-second"]);$("#dn").textContent=bps(t["rx-bits-per-second"])}catch(e){}};
    poll();tm=setInterval(poll,2500);
  }catch(e){$("#st").innerHTML=`<b class="bad">● غير متصل</b><p class="m">${E(e.message)}</p><div class="row"><button class="btn b-blue" id="rt">إعادة المحاولة</button><button class="btn b-orange" id="ed2">تعديل بيانات الشبكة</button></div>`;$("#rt").onclick=()=>dash();$("#ed2").onclick=()=>netForm(S.cur)}
}
function netForm(id){
  clearInterval(tm);
  const old=id?getNet(id):null;if(id&&!old)return home();
  if(!old&&S.nets.length>=MAXN){toast("الحد الأقصى "+MAXN+" شبكة");return home()}
  const n=old||{id:"",name:"",i:ICONS[0],c:1,ip:"192.168.88.1",user:"admin",pass:"",https:false,ifc:"ether1"};
  let ic=n.i,cc=n.c;
  v.innerHTML=`<div class="card"><h3>${old?"تعديل الشبكة":"شبكة جديدة"}</h3>
  <label>اسم الشبكة</label><input id="nn" value="${E(n.name)}" placeholder="مثال: محل الحي">
  <label>الأيقونة</label><div class="ics" id="ics">${ICONS.map(x=>`<button type="button" class="chip${x===ic?" on":""}" data-i="${x}">${x}</button>`).join("")}</div>
  <label>اللون</label><div class="ics" id="cls">${GRAD.map((g,k)=>`<button type="button" class="chip tc${k+1===cc?" on":""}" data-c="${k+1}" style="background:${g}"></button>`).join("")}</div></div>
  <div class="card"><h3>بيانات الراوتر</h3><label>عنوان الراوتر</label><input id="ip" class="ltr" value="${E(n.ip)}">

  $("#ics").onclick=e=>{const b=e.target.closest("[data-i]");if(!b)return;ic=b.dataset.i;v.querySelectorAll("#ics .chip").forEach(x=>x.classList.toggle("on",x===b))};

    const k=S.nets.findIndex(x=>x.id===o.id);if(k>=0)S.nets[k]=o;else S.nets.push(o);

  };
}

const DPRE=[["ساعة",0,1,0],["3 ساعات",0,3,0],["12 ساعة",0,12,0],["يوم",1,0,0],["3 أيام",3,0,0],["أسبوع",7,0,0],["شهر",30,0,0]];
const QPRE=[["500MB",500,"MB"],["1GB",1,"GB"],["2GB",2,"GB"],["5GB",5,"GB"],["10GB",10,"GB"]];
const durStr=(d,h,m)=>(d?d+"d":"")+(h?h+"h":"")+(m?m+"m":"");
const durAr=(d,h,m)=>[d&&(d+" يوم"),h&&(h+" ساعة"),m&&(m+" دقيقة")].filter(Boolean).join(" و ");
const toBytes=(q,u)=>u==="GB"?Math.round(q*1073741824):u==="MB"?Math.round(q*1048576):0;
const rnd=(n,k)=>{const s=k==="num"?"0123456789":k==="alpha"?"abcdefghjkmnpqrstuvwxyz":"abcdefghjkmnpqrstuvwxyz23456789",a=new Uint32Array(n);crypto.getRandomValues(a);return[...a].map(x=>s[x%s.length]).join("")};

function sheets(count,cols){const w=(194-(cols-1)*3)/cols,h=w*674/1280,rows=Math.max(1,Math.floor((281+3)/(h+3)));return Math.max(1,Math.ceil(count/(rows*cols)))}
